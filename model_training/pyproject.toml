[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "railvivid-research"
version = "0.1.0"
description = "Provenance-aware railway vibration and vision research pipeline"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.3", "Pillow>=10", "matplotlib>=3.7"]

[project.optional-dependencies]
vision = ["transformers>=4.56", "torchvision>=0.18", "safetensors>=0.4"]
dev = ["pytest>=8"]
alignment = ["opencv-python-headless>=4.10"]

[project.scripts]
railvivid = "railvivid.cli:main"
track-ot = "track_ot.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["railvivid*", "src*", "track_ot*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests_pipeline"]
